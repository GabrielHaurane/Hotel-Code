# Configuración de Netlify para el frontend de Hotel Code (Vite SPA).
# Con esto, al conectar el repo en Netlify, no hace falta configurar nada a mano:
# toma el build, la carpeta de salida, la URL de la API y el ruteo del SPA.
# Las claves de EmailJS (VITE_EMAILJS_*) se cargan en el panel de Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# URL base de la API (apunta al backend en Render). No es secreta: queda
# igual embebida en el bundle del cliente, así que va acá directamente.
[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://hotel-code-backend.onrender.com/api"

# Ruteo del SPA: react-router usa BrowserRouter, así que cualquier ruta
# (ej. /catalogo, /login) debe servir index.html en vez de dar 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
